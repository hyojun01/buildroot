# RTE control daemon settings.
# Leave the listener empty to bind to the point-to-point USB Ethernet address
# from U-Boot's ipaddr variable (192.168.2.1 when the variable is absent).
RTE_HTTPD_LISTEN_URL=""
RTE_HTTPD_PORT="8080"
RTE_HTTPD_DEVICE="/dev/mwipcore0"
# Directory served at / by rte-httpd. Keep the API and GUI on the same origin.
RTE_HTTPD_WEB_ROOT="/usr/share/rte-control/www"
RTE_HTTPD_STATE="/mnt/jffs2/rte-multitarget/last-config.json"
RTE_HTTPD_PERSIST="1"
RTE_HTTPD_LOG_LEVEL=""
